[project]
name = "monitorfinance"
version = "0.1.0"
description = "Backend for MonitorFinance — monobank ingest, categorization, analytics."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    # scripts/build_app_icon.py — the app icon is generated, not hand-drawn.
    "pillow>=11",
    # scripts/upload_categorizations.py — service-account auth (board #146).
    # That file's own note explains why the refresh-token flow was hand-rolled
    # over httpx: it is one POST. A service account is not. It needs an
    # RSA-SHA256 signature over a JWT, and hand-rolling ASYMMETRIC CRYPTO is a
    # different kind of decision from hand-rolling a zip reader — one has a
    # wrong answer that still looks like it works.
    "pyjwt[crypto]>=2.10",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# The line-length setting alone only guides the formatter; E501 is what makes
# 100 columns an actual gate a review can rely on.
extend-select = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Vendored unchanged from the live Gmail->Sheets pipeline and kept byte-identical
# so the two stay in sync. Its style is not ours to fix here.
"app/core/categories.py" = ["UP034", "PIE810"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
